name: foundation-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Verify runtime
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.19.0"

      - name: Install
        run: npm ci

      - name: Encoding
        run: npm run test:encoding

      - name: Formatting
        run: npm run format:check

      - name: Baseline
        run: npm run verify:baseline

      - name: Foundation policy
        run: npm run verify:foundation

      - name: Toolchain
        run: npm run verify:toolchain

      - name: Direct dependency reachability
        run: npm run verify:dependency-usage && npm run test:dependency-usage

      - name: Reachability-aware audit
        run: npm run verify:audit

      - name: DB compatibility policy
        run: npm run verify:db-compatibility

      - name: Disposable application and Release State PostgreSQL
        run: npm run test:db:disposable

      - name: Provider policy
        run: npm run verify:provider-policy

      - name: CSP policy
        run: npm run verify:csp-policy

      - name: Metrics contract
        run: npm run verify:metrics-contract

      - name: Metrics retention policy
        run: npm run verify:metrics-retention

      - name: Performance policy
        run: npm run verify:performance-policy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test project membership
        run: npm run verify:test-project-membership

      - name: Architecture
        run: npm run verify:architecture

      - name: Coverage policy
        run: npm run verify:coverage-policy

      - name: Coverage policy tests
        run: npm run test:coverage-policy

      - name: Foundation and artifact tests
        run: npm run test:foundation

      - name: All Vitest projects
        run: npm run test:run

      - name: Worker
        run: npm run test:worker

      - name: API
        run: npm run test:api

      - name: Coverage
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run test:coverage

      - name: Release A evidence compatibility
        run: npm run test:release-a-evidence

      - name: Verify deterministic artifact fixtures
        run: npm run verify:artifact

      - name: Non-production QA builds
        run: npm run test:qa-builds

      - name: Release A build
        run: npm run build:release-a

      - name: Install pinned Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Release A browser preflight
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if ! kill -0 "$preview_pid"; then
              exit 1
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4173/ >/dev/null
          npm run test:release-a-browser

      - name: Browser
        run: npm run test:browser

      - name: Accessibility
        run: npm run test:a11y

      - name: Audit all graphs
        continue-on-error: true
        run: npm audit

      - name: Audit production graph
        continue-on-error: true
        run: npm audit --omit=dev

  release-a-rollback:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Pin npm
        shell: pwsh
        run: npm install --global npm@11.19.0

      - name: Install
        shell: pwsh
        run: npm ci

      - name: Release A rollback rehearsal
        shell: pwsh
        run: npm run test:release-a-rollback

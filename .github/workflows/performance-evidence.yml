name: Foundation physical performance evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: foundation-performance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  collect-own-gate-performance:
    runs-on: [self-hosted, Windows, X64, foundation-performance]
    environment: foundation-performance
    timeout-minutes: 720
    env:
      RELEASE_STATE_NAMESPACE: ${{ vars.RELEASE_STATE_NAMESPACE }}
      RELEASE_STATE_DATABASE_URL: ${{ secrets.RELEASE_STATE_DATABASE_URL }}
      RELEASE_STATE_DATABASE_CA_PEM: ${{ secrets.RELEASE_STATE_DATABASE_CA_PEM }}
      FOUNDATION_PERFORMANCE_POWER_MODE: ${{ vars.FOUNDATION_PERFORMANCE_POWER_MODE }}
      FOUNDATION_PERFORMANCE_RUNNER_LABELS: self-hosted,Windows,X64,foundation-performance
      FOUNDATION_PROTECTED_ENVIRONMENT: foundation-performance
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install exact dependency graph
        shell: pwsh
        run: |
          npm exec --yes --package=npm@11.19.0 -- npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) {
            throw "Exact npm dependency installation failed with exit code $LASTEXITCODE"
          }

      - name: Verify exact toolchain
        shell: pwsh
        run: |
          npm exec --yes --package=npm@11.19.0 -- npm run verify:toolchain
          if ($LASTEXITCODE -ne 0) {
            throw "Exact toolchain verification failed with exit code $LASTEXITCODE"
          }

      - name: Verify source performance policy
        shell: pwsh
        run: |
          npm exec --yes --package=npm@11.19.0 -- npm run verify:performance-policy
          if ($LASTEXITCODE -ne 0) {
            throw "Performance policy verification failed with exit code $LASTEXITCODE"
          }

      - name: Collect authoritative physical samples
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $env:RUNNER_TEMP 'foundation-performance-raw-output'
          if (Test-Path -LiteralPath $outputDirectory) {
            throw 'Raw performance output directory already exists'
          }
          New-Item -ItemType Directory -Path $outputDirectory | Out-Null
          $outputPath = Join-Path $outputDirectory 'raw-performance-samples.json'
          npm exec --yes --package=npm@11.19.0 -- npm run performance:own-gate-samples:collect -- -- --namespace $env:RELEASE_STATE_NAMESPACE --output $outputPath
          if ($LASTEXITCODE -ne 0) {
            throw "Authoritative performance collection failed with exit code $LASTEXITCODE"
          }
          $files = @(Get-ChildItem -LiteralPath $outputDirectory -File -Force)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'raw-performance-samples.json') {
            throw 'Raw performance artifact must contain exactly one canonical file'
          }
          if ($files[0].Length -le 0) {
            throw 'Raw performance artifact is empty'
          }
          $rawSha256 = (Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "Raw performance run/source/SHA-256: ``$env:GITHUB_RUN_ID`` / ``$env:GITHUB_SHA`` / ``$rawSha256``"

      - name: Upload authoritative raw performance samples
        uses: actions/upload-artifact@v4
        with:
          name: foundation-performance-raw-samples-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundation-performance-raw-output/raw-performance-samples.json
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          compression-level: 0
          retention-days: 14

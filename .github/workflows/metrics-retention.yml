name: Foundation retention verification

on:
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-retention-verifier
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: foundation-release-state
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - run: npm ci

      - name: Verify static and remote retention state
        env:
          PERSISTENCE_METRICS_VERIFIER_DATABASE_URL: ${{ secrets.PERSISTENCE_METRICS_VERIFIER_DATABASE_URL }}
          PERSISTENCE_METRICS_VERIFIER_CA: ${{ secrets.PERSISTENCE_METRICS_VERIFIER_CA }}
        run: npm run verify:metrics-retention -- --live

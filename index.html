<!DOCTYPE html>
<html lang="ja" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="同人誌即売会の購入リスト管理アプリ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="巡回表" />
    <title>即売会 購入巡回表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tailwind CDNのダークモード設定（classベース）
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <style>
      /* ===== ダークモード用CSS変数 ===== */
      :root {
        --bg-primary: #f8fafc;
        --bg-secondary: #ffffff;
        --bg-tertiary: #f1f5f9;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --border-color: #e2e8f0;
      }
      
      /* data-theme="dark" の場合 */
      [data-theme="dark"] {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --border-color: #334155;
      }
      
      /* data-theme="system" でシステムがダークモードの場合 */
      @media (prefers-color-scheme: dark) {
        [data-theme="system"] {
          --bg-primary: #0f172a;
          --bg-secondary: #1e293b;
          --bg-tertiary: #334155;
          --text-primary: #f1f5f9;
          --text-secondary: #94a3b8;
          --border-color: #334155;
        }
      }
      
      /* Android用タッチ最適化 */
      * {
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0.1);
        -webkit-touch-callout: none;
      }
      
      body {
        overscroll-behavior-y: contain;
        -webkit-overflow-scrolling: touch;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* セレクト・インプット要素のズーム防止 */
      input, select, textarea {
        font-size: 16px !important;
      }
      
      /* カスタムスクロールバー */
      ::-webkit-scrollbar {
        width: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: var(--bg-tertiary);
      }
      
      ::-webkit-scrollbar-thumb {
        background: var(--text-secondary);
        border-radius: 4px;
      }
      
      /* フェードインアニメーション */
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .animate-fade-in {
        animation: fade-in 0.3s ease-out;
      }
      
      /* ローディング画面 */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: var(--bg-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s, background-color 0.3s;
      }
      
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      #loading-text {
        color: var(--text-secondary);
      }
    </style>
    <script>
      // 初期ロード時にテーマを適用（フラッシュ防止）
      (function() {
        const themeMode = localStorage.getItem('themeMode') || 'system';
        document.documentElement.setAttribute('data-theme', themeMode);
        
        // Tailwindのdarkクラスも同期
        if (themeMode === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (themeMode === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          // システム設定に従う
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="loading-screen">
      <div class="text-center">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
        <p id="loading-text" class="mt-4">読み込み中...</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      // ローディング画面を非表示
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.getElementById('loading-screen').classList.add('hidden');
        }, 300);
      });
      
      // iOS Safariのビューポート高さ問題を修正
      function setViewportHeight() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }
      
      setViewportHeight();
      window.addEventListener('resize', setViewportHeight);
      window.addEventListener('orientationchange', setViewportHeight);
    </script>
  </body>
</html>
